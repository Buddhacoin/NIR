name: test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  browser-wallet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Install browser wallet dependencies
        working-directory: browser-wallet
        run: npm ci
      - name: Build and test browser wallet cryptography
        working-directory: browser-wallet
        run: npm test
      - name: Package Firefox submission candidate
        working-directory: browser-wallet
        run: npm run package:firefox
      - name: Attach unsigned Firefox submission candidate
        uses: actions/upload-artifact@v4
        with:
          name: nir-firefox-wallet-unsigned-submission-candidate
          path: browser-wallet/artifacts/firefox/*.zip
          if-no-files-found: error
          retention-days: 7
      - name: Install isolated Chromium test browser
        working-directory: browser-wallet
        run: npx playwright install --with-deps chromium webkit
      - name: Test extension in Chromium
        working-directory: browser-wallet
        run: npm run test:browser
      - name: Test one-link web wallet in Chromium and WebKit
        working-directory: browser-wallet
        run: npm run test:web
      - name: Attach developer-preview extension
        uses: actions/upload-artifact@v4
        with:
          name: nir-browser-wallet-developer-preview
          path: browser-wallet/dist/
          if-no-files-found: error
          retention-days: 7

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: npm run verify
      - name: Rehearse node and wallet release installation on Linux
        run: npm run release:rehearse
      - name: Install Rust verification toolchain
        run: rustup show active-toolchain
      - name: Verify independent Rust consensus codec
        working-directory: rust/nir-consensus-codec
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
