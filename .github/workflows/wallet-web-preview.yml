name: wallet-web-preview

on:
  push:
    branches: [main]
    paths:
      - browser-wallet/**
      - blockchain/bip39-english.txt
      - wallet-ui/nir-coin-icon.png
      - .github/workflows/wallet-web-preview.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wallet-web-preview-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Install and build static wallet
        working-directory: browser-wallet
        run: |
          npm ci
          npm run build:web
      - name: Install isolated test browsers
        working-directory: browser-wallet
        run: npx playwright install --with-deps chromium webkit
      - name: Test static wallet before deployment
        working-directory: browser-wallet
        run: npm run test:web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: browser-wallet/dist-web
      - id: deployment
        uses: actions/deploy-pages@v4
