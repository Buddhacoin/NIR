<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f6f6"><link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="nir-coin-icon.svg?v=14">
  <link rel="stylesheet" href="style.css?v=14"><title>NIR Wallet</title>
</head>
<body>
  <main class="shell">
    <header><div class="brand"><span class="brand-logo">N</span><b>NIR</b></div><div class="header-actions"><button id="theme" aria-label="Сменить тему">☀</button><button class="network" data-action="network">● Local testnet</button></div></header>
    <section class="balance"><p>Общий баланс</p><h1>0.00000000 <small>NIR</small></h1><span>Тестовая сеть · реальные средства отключены</span></section>
    <section class="actions">
      <button data-action="receive"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v14m0 0 5-5m-5 5-5-5"/></svg></i>Получить</button><button data-action="send"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V6m0 0 5 5m-5-5-5 5"/></svg></i>Отправить</button><button data-action="mine"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/><path d="M18.5 16l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2Z"/></svg></i>Майнинг</button>
    </section>
    <section class="card" id="history"><div class="title"><h2>Последние операции</h2><button data-action="history">Все <span>›</span></button></div><div class="empty"><div><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h11m0 0-3-3m3 3-3 3M17 17H6m0 0 3 3m-3-3 3-3"/></svg></div><b>Операций пока нет</b><p>Создайте адрес или подключитесь к тестовой сети.</p></div></section>
    <nav aria-label="Основная навигация"><button class="active" data-nav="home" aria-current="page"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 11 8-7 8 7v9h-5v-6H9v6H4v-9Z"/></svg></i><span>Главная</span></button><button data-nav="history"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="8"/></svg></i><span>История</span></button><button data-nav="mine"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/><path d="M18.5 16l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2Z"/></svg></i><span>Майнинг</span></button><button data-nav="settings"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10m4 0h2M4 17h2m4 0h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></i><span>Настройки</span></button></nav>
  </main>
  <dialog id="panel"><button class="close" aria-label="Закрыть">×</button><h2 id="panel-title"></h2><p id="panel-copy"></p><button class="primary">Понятно</button></dialog>
  <script src="app.js?v=14"></script>
</body></html>
