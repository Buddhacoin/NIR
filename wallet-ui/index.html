<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0a08"><link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="nir-coin-icon.png?v=4">
  <link rel="stylesheet" href="style.css?v=4"><title>NIR Wallet</title>
</head>
<body>
  <main class="shell">
    <header><div class="brand"><img class="brand-logo" src="nir-coin-icon.png?v=4" alt="NIR"><b>NIR</b></div><div class="header-actions"><button id="theme" aria-label="Сменить тему">☀</button><button class="network">● Local testnet</button></div></header>
    <section class="balance"><p>Общий баланс</p><h1>0.00000000 <small>NIR</small></h1><span>Тестовая сеть · реальные средства отключены</span></section>
    <section class="actions">
      <button data-action="receive"><i>↓</i>Получить</button><button data-action="send"><i>↑</i>Отправить</button><button data-action="mine"><i>✦</i>Майнинг</button>
    </section>
    <section class="card"><div class="title"><h2>Последние операции</h2><button>Все</button></div><div class="empty"><div>◎</div><b>Операций пока нет</b><p>Создайте адрес или подключитесь к тестовой сети.</p></div></section>
    <nav><button class="active">⌂<span>Главная</span></button><button>⇄<span>История</span></button><button>✦<span>Майнинг</span></button><button>⚙<span>Настройки</span></button></nav>
  </main>
  <dialog id="panel"><button class="close" aria-label="Закрыть">×</button><h2 id="panel-title"></h2><p id="panel-copy"></p><button class="primary">Понятно</button></dialog>
  <script src="app.js?v=4"></script>
</body></html>
